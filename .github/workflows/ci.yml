name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, pdo_mysql, gd, zip, mbstring
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      # Build the Laravel Vite assets so public/build/manifest.json exists
      # when the test suite renders Blade views that call @vite().
      - name: Setup Node for Laravel assets
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root npm dependencies
        run: npm ci

      - name: Build Laravel Vite assets
        run: npm run build

      - name: Run Pint (code style)
        run: ./vendor/bin/pint --test

      - name: Run test suite
        run: vendor/bin/phpunit
        # phpunit.xml already points every connection at in-memory SQLite,
        # so no MySQL service container is needed here.

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        # VITE_SUPABASE_URL is non-secret so it can live in netlify.toml and here.
        # VITE_SUPABASE_ANON_KEY is a publishable/anon key (safe for the browser)
        # but still kept as a GitHub secret so it isn't hardcoded in source.
        # Secret name: VITE_SUPABASE_ANON_KEY (set in repo Settings → Secrets)
        env:
          VITE_SUPABASE_URL: https://pzfohowzaeunywaqukwe.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_URL: https://pzfohowzaeunywaqukwe.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
