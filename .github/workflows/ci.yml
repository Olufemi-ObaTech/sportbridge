name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # ── 1. PHP tests + Pint ────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, pdo_mysql, gd, zip, mbstring
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      # Build Laravel Vite assets so public/build/manifest.json exists
      # when PHPUnit renders Blade views that call @vite()
      - name: Setup Node for Laravel assets
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root npm dependencies
        run: npm ci

      - name: Build Laravel Vite assets
        run: npm run build

      - name: Verify Vite manifest exists
        run: |
          if [ ! -f public/build/manifest.json ]; then
            echo "ERROR: public/build/manifest.json not found — npm run build may have failed"
            exit 1
          fi
          echo "Vite manifest OK"

      - name: Run Pint (code style)
        run: ./vendor/bin/pint --test

      - name: Run test suite
        run: vendor/bin/phpunit

  # ── 2. React build + Netlify deploy ───────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    # Only deploy on pushes to main (not on PRs)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: test   # don't deploy if PHP tests fail

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: https://pzfohowzaeunywaqukwe.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: frontend/dist
          production-branch: main
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions — ${{ github.sha }}"
          enable-pull-request-comment: false
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 599b1ac1-10e6-4a98-8981-a3bc038b8f68
