<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SportBridge</title>
    <style>
        :root { color-scheme: dark; font-family: system-ui, sans-serif; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #071a3d; color: #f7f9f8; }
        main { width: min(92vw, 680px); padding: 3rem; text-align: center; }
        h1 { margin: 0 0 1rem; font-size: clamp(2.5rem, 8vw, 5rem); letter-spacing: -.04em; }
        p { margin: 0 auto 2rem; max-width: 38rem; color: #c8d4e6; line-height: 1.6; }
        a { display: inline-block; padding: .85rem 1.2rem; border-radius: .5rem; background: #e9b949; color: #071a3d; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <main>
        <h1>SportBridge</h1>
        <p>Connecting players, academies, agents, scouts and coaches across football and basketball.</p>
        <a href="https://sportbridge.up.railway.app/">Open the SportBridge application</a>
    </main>
</body>
</html>
