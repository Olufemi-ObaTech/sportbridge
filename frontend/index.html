<!doctype html>
<html lang="en" dir="ltr" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071a3d" />
    <meta name="description" content="SportBridge - connecting players, clubs, academies, agents, scouts and coaches across football and basketball, worldwide." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/img/logo-mark.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SportBridge" />
    <title>SportBridge — Stop Chasing Fake Agents. Get Verified.</title>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <div id="root"></div>
    <script>
      /* SportBridge — Remove Netlify "Powered by" badge aggressively */
      (function() {
        function removeNetlifyBadge() {
          /* 1. By data attribute */
          document.querySelectorAll('[data-netlify-badge], .netlify-badge, #netlify-badge').forEach(el => el.remove())
          /* 2. By href containing netlify badge URL */
          document.querySelectorAll('a[href*="netlify.com"]').forEach(el => {
            if (el.textContent.includes('Netlify') || el.querySelector('img[src*="netlify"]')) {
              const wrapper = el.parentElement
              if (wrapper && (wrapper.style.position === 'fixed' || getComputedStyle(wrapper).position === 'fixed')) {
                wrapper.remove()
              } else {
                el.remove()
              }
            }
          })
          /* 3. By fixed-position wrappers containing netlify content */
          document.querySelectorAll('div[style*="position"]').forEach(el => {
            const style = el.getAttribute('style') || ''
            if ((style.includes('fixed') || style.includes('z-index')) && el.innerHTML.toLowerCase().includes('netlify')) {
              el.remove()
            }
          })
          /* 4. By image src */
          document.querySelectorAll('img[src*="netlify"], img[alt*="Netlify"]').forEach(el => {
            const wrapper = el.closest('a, div[style*="fixed"]')
            if (wrapper) wrapper.remove()
            else el.remove()
          })
          /* 5. Nuclear: any fixed element in bottom-right that isn't ours */
          document.querySelectorAll('body > div[style], body > a[style]').forEach(el => {
            const s = getComputedStyle(el)
            if (s.position === 'fixed' && (parseInt(s.bottom) >= 0) && (parseInt(s.right) >= 0)) {
              if (el.innerHTML.toLowerCase().includes('netlify') || !el.id) {
                el.style.display = 'none'
              }
            }
          })
        }

        /* Run immediately */
        removeNetlifyBadge()

        /* Run after DOM ready */
        document.addEventListener('DOMContentLoaded', removeNetlifyBadge)

        /* Run after full load */
        window.addEventListener('load', removeNetlifyBadge)

        /* Keep watching for injected elements */
        const obs = new MutationObserver(removeNetlifyBadge)
        document.addEventListener('DOMContentLoaded', () => {
          obs.observe(document.body, { childList: true, subtree: true })
        })

        /* Delayed checks (badge is sometimes injected late) */
        setTimeout(removeNetlifyBadge, 500)
        setTimeout(removeNetlifyBadge, 1500)
        setTimeout(removeNetlifyBadge, 3000)
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {})
        })
      }
    </script>
  </body>
</html>
