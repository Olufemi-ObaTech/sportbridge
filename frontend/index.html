<!doctype html>
<html lang="en" dir="ltr" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071a3d" />
    <meta name="description" content="SportBridge - connecting players, clubs, academies, agents, scouts and coaches across football and basketball, worldwide." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/img/logo-mark.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SportBridge" />
    <title>SportBridge — Stop Chasing Fake Agents. Get Verified.</title>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <div id="root"></div>
    <script>
      /* Remove Netlify's "Powered by Netlify" badge — multiple selector strategies */
      (function() {
        const selectors = [
          '[data-netlify-badge]',
          '.netlify-badge',
          '#netlify-badge',
          'a[href*="netlify.com"][style*="position:fixed"]',
          'a[href*="netlify.com"][style*="position: fixed"]',
          'a[href*="app.netlify.com"]',
          'img[src*="netlify"]',
          'div[style*="z-index: 99999"]',
          'div[style*="z-index:99999"]',
        ]
        const remove = () => {
          selectors.forEach(sel => {
            document.querySelectorAll(sel).forEach(el => {
              /* walk up to remove the containing anchor/div if small */
              const parent = el.closest('a[href*="netlify"], div[data-netlify]') || el
              parent.remove()
            })
          })
          /* Catch badge by text content — "Powered by Netlify" */
          document.querySelectorAll('a, div, span').forEach(el => {
            if (el.textContent.trim() === 'Powered by Netlify' || el.getAttribute('href')?.includes('netlify.com/badge')) {
              const parent = el.closest('a') || el
              parent.remove()
            }
          })
        }
        remove()
        const obs = new MutationObserver(remove)
        document.addEventListener('DOMContentLoaded', () => {
          remove()
          obs.observe(document.body, { childList: true, subtree: true })
        })
        window.addEventListener('load', remove)
        setTimeout(remove, 1000)
        setTimeout(remove, 3000)
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {})
        })
      }
    </script>
  </body>
</html>
