# Netlify hosts the public static experience and compiled Vite assets.
# Server-side application services are being migrated to Supabase.
[build]
  command = "npm ci && npm run build && cp netlify/index.html public/build/index.html"
  publish = "public/build"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Allow the Supabase-backed application to fetch assets cross-origin.
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
