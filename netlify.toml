# Netlify hosts ONLY the compiled Vite assets (CSS/JS) as a static CDN.
# The Laravel app itself runs on Railway - see DEPLOYMENT.md. Point
# ASSET_URL (Railway env var) at this site's URL so Blade's @vite()
# directive serves assets from here instead of the app's own domain.
[build]
  command = "npm ci && npm run build"
  publish = "public/build"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# CORS: the app domain (Railway) fetches the manifest and font/asset files
# cross-origin from this Netlify domain.
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
