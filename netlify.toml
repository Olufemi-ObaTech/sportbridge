# Netlify configuration for SportBridge
# Keys must be set in Netlify UI: Site configuration → Environment variables
# Do NOT put secret or API keys in this file — Netlify scans commits for secrets.

[build]
  command = "cd frontend && npm ci && npm run build"
  publish = "frontend/dist"

[build.environment]
  VITE_SUPABASE_URL = "https://pzfohowzaeunywaqukwe.supabase.co"
  NODE_VERSION      = "22"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from   = "http://sportbridge.com.ng/*"
  to     = "https://www.sportbridge.com.ng/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "https://sportbridge.com.ng/*"
  to     = "https://www.sportbridge.com.ng/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "http://www.sportbridge.com.ng/*"
  to     = "https://www.sportbridge.com.ng/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "https://sportbridgeng.netlify.app/*"
  to     = "https://sportbridge-ng-com.netlify.app/:splat"
  status = 301
  force  = true

# SPA fallback — all paths serve index.html so React Router can handle them
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
