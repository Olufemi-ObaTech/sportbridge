# Netlify configuration for SportBridge
# Live URL: https://sportbridge-com-ng.netlify.app
# Custom domain: sportbridge.online (activate after DNS is configured)
#
# Required env vars — set in Netlify UI (Site configuration → Environment variables):
#   VITE_SUPABASE_URL      = https://pzfohowzaeunywaqukwe.supabase.co
#   VITE_SUPABASE_ANON_KEY = eyJ...  (anon/public key from Supabase dashboard)
#   SUPABASE_URL           = https://pzfohowzaeunywaqukwe.supabase.co
#   SUPABASE_ANON_KEY      = eyJ...  (same anon key, used by health function)
#   BREVO_API_KEY          = xkeysib-...  (Brevo API key — NOT the SMTP key)
#   MAIL_FROM_EMAIL        = noreply@sportbridge.com.ng
#   MAIL_FROM_NAME         = SportBridge
# Do NOT put the actual key values in this file — it is committed to GitHub.

[build]
  command = "cd frontend && npm ci && npm run build"
  publish = "frontend/dist"

[build.environment]
  VITE_SUPABASE_URL = "https://pzfohowzaeunywaqukwe.supabase.co"
  NODE_VERSION      = "22"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Security headers for all pages ─────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent MIME-type sniffing
    X-Content-Type-Options = "nosniff"
    # Block clickjacking
    X-Frame-Options = "SAMEORIGIN"
    # XSS protection (legacy browsers)
    X-XSS-Protection = "1; mode=block"
    # Referrer policy
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Permissions policy — restrict unnecessary browser APIs
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # HSTS — enforce HTTPS for 1 year
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Content Security Policy — allow Supabase + Bootstrap + local assets
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: https://*.supabase.co blob:; connect-src 'self' https://*.supabase.co https://api.brevo.com wss://*.supabase.co; frame-ancestors 'none';"

# SPA fallback — every path serves index.html so React state-based routing works
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
