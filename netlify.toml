# Netlify configuration for SportBridge
# Live URL: https://sportbridge-com-ng.netlify.app
# Custom domain: sportbridge.online
#
# Required env vars — set in Netlify UI (Site configuration → Environment variables):
#   VITE_SUPABASE_URL      = https://pzfohowzaeunywaqukwe.supabase.co
#   VITE_SUPABASE_ANON_KEY = eyJ...  (anon/public key from Supabase dashboard)
#   SUPABASE_URL           = https://pzfohowzaeunywaqukwe.supabase.co
#   SUPABASE_ANON_KEY      = eyJ...  (same anon key, used by health function)
#   BREVO_API_KEY          = xkeysib-...  (Brevo API key — NOT the SMTP key)
#   MAIL_FROM_EMAIL        = noreply@sportbridge.online
#   MAIL_FROM_NAME         = SportBridge
# Do NOT put the actual key values in this file — it is committed to GitHub.

[build]
  command = "cd frontend && npm ci && npm run build"
  publish = "frontend/dist"

[build.environment]
  VITE_SUPABASE_URL      = "https://pzfohowzaeunywaqukwe.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6Zm9ob3d6YWV1bnl3YXF1a3dlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNzQ0NTksImV4cCI6MjEwNTc1MDQ1OX0.kTcQgqGgB9Fgs9q_13PeQgzNxpuxH_foK8we5JrFZik"
  NODE_VERSION           = "22"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Security headers for all pages ─────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# SPA fallback — every path serves index.html so React state-based routing works
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
