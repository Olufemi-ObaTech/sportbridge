[build]
  command = "cd frontend && npm ci && npm run build"
  publish = "frontend/dist"

[build.environment]
  VITE_SUPABASE_URL      = "https://qnueqhlxmtkvecppygrk.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFudWVxaGx4bXRrdmVjcHB5Z3JrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2NTgwNjcsImV4cCI6MjExMDIzNDA2N30.zH5_vV2buGNILYyg6Regk8eLo60-cIV66SdvCD6x9to"
  NODE_VERSION           = "22"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Security headers for all pages ─────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# SPA fallback — every path serves index.html so React state-based routing works
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
