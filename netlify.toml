# Netlify hosts the public static experience and compiled Vite assets.
# Server-side application services are being migrated to Supabase.
[build]
  command = "cd frontend && npm ci && npm run build"
  publish = "frontend/dist"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "http://sportbridge.com.ng/*"
  to = "https://www.sportbridge.com.ng/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://sportbridge.com.ng/*"
  to = "https://www.sportbridge.com.ng/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.sportbridge.com.ng/*"
  to = "https://www.sportbridge.com.ng/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
